name: Windows Desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node node_modules/electron/install.js
      - run: npm run test:activities
      - run: npm run test:desktop
        env:
          KARTBLITZ_TEST_USER_DATA: ${{ runner.temp }}\kartblitz-smoke
      - run: npm run desktop:build
      - name: Verify the packaged application
        run: npx playwright test --config desktop/playwright.config.mjs
        env:
          KARTBLITZ_PACKAGED_EXE: ${{ github.workspace }}\dist\windows\win-unpacked\KartBlitz.exe
          KARTBLITZ_TEST_USER_DATA: ${{ runner.temp }}\kartblitz-packaged-smoke
      - run: node scripts/release-checksums.mjs
      - run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: KartBlitz-Windows-portable
          path: |
            dist/windows/*-portable.exe
            dist/windows/SHA256SUMS.txt
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KartBlitz-Windows-portable
          path: release-assets
      - name: Prepare a draft for verification before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "KartBlitz $GITHUB_REF_NAME" release-assets/*
