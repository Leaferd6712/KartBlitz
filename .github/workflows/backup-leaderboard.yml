name: Backup Leaderboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Game And Worker"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: backup-leaderboard
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Export leaderboard backup
        run: node scripts/backup-leaderboard.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEADERBOARD_BACKUP_URL: https://kartblitz-online.kartblitz.workers.dev/api/leaderboard-backup.txt

      - name: Commit backup file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/leaderboard.txt
          if git diff --cached --quiet; then
            echo "Leaderboard backup unchanged"
            exit 0
          fi
          git commit -m "Backup cloud leaderboard snapshot. [skip ci]"
          git push origin HEAD:main
