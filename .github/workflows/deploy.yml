name: Deploy Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare static site
        run: |
          mkdir -p public/ml/models public/ml_training public/sim/tracks
          cp index.html public/
          cp leaderboard-admin.html public/
          cp patch-notes-editor.html public/
          cp online.js public/
          cp online-codec.js public/
          cp online-sim.js public/
          cp rb6.glb public/
          cp ml/lab.css ml/lab.js ml/runtime.js public/ml/
          cp ml/models/our-model.json public/ml/models/
          cp ml_training/__init__.py public/ml_training/
          cp ml_training/environment.py public/ml_training/
          cp ml_training/model.py public/ml_training/
          cp ml_training/train.py public/ml_training/
          cp ml_training/server.py public/ml_training/
          cp ml_training/requirements.txt public/ml_training/
          cp ml_training/install.ps1 public/ml_training/
          cp ml_training/start.ps1 public/ml_training/
          cp ml_training/README.md public/ml_training/
          cp ml_training/KartBlitz-ML-Setup.txt public/ml_training/
          cp sim/*.mjs public/sim/
          cp sim/tracks/bakes.json public/sim/tracks/

      - name: Verify required game assets
        run: |
          test -f public/index.html
          test -f public/ml/lab.js
          test -f public/ml/lab.css
          test -f public/ml/runtime.js
          test -f public/ml/models/our-model.json
          test -f public/ml_training/train.py
          test -f public/ml_training/KartBlitz-ML-Setup.txt
          test -f public/sim/pb-ghost.mjs
          test -f public/sim/player-save.mjs
          test -f public/sim/tracks/bakes.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publish-pages:
    needs: deploy-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

