<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KartBlitz ML Training Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: #120f1f;
      color: #eee;
      min-height: 100vh;
    }
    a { color: #00f5ff; }
    .lab-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(30,25,50,0.95);
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }
    .lab-header h1 { margin: 0; font-size: 1.25rem; }
    .lab-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 56px);
    }
    .lab-nav {
      background: rgba(20,18,35,0.98);
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 12px 8px;
      overflow-y: auto;
    }
    .lab-nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin-bottom: 4px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #ccc;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .lab-nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .lab-nav-item.active { background: rgba(0,245,255,0.15); color: #00f5ff; }
    .lab-main { padding: 16px 20px; overflow-y: auto; }
    .hidden { display: none !important; }
    #lab-canvas {
      width: 100%;
      max-width: 960px;
      height: 540px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.12);
      background: #1a1528;
    }
    .tool-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
      align-items: center;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(0,245,255,0.12);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: rgba(0,245,255,0.22); }
    .btn-warn { background: rgba(255,107,53,0.2); }
    #lab-status {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.85;
    }
    #lab-doc-body h2 { margin-top: 1.2em; color: #00f5ff; font-size: 1.1rem; }
    #lab-doc-body pre {
      background: rgba(0,0,0,0.35);
      padding: 12px 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
    }
    #lab-doc-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin: 12px 0;
    }
    #lab-doc-body th, #lab-doc-body td {
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 10px;
      text-align: left;
    }
    #lab-doc-body dl dt { font-weight: 900; color: #ffd700; margin-top: 10px; }
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
    }
    .lab-panel h3 { margin-top: 0; }
    @media (max-width: 768px) {
      .lab-layout { grid-template-columns: 1fr; }
      .lab-nav { display: flex; flex-wrap: wrap; gap: 4px; }
      .lab-nav-item { width: auto; }
    }
  </style>
</head>
<body>
  <header class="lab-header">
    <h1>KartBlitz ML Training Lab</h1>
    <a href="index.html">← Back to Game</a>
  </header>
  <div class="lab-layout">
    <nav id="lab-nav" class="lab-nav" aria-label="Training sections"></nav>
    <main class="lab-main">
      <div id="lab-tool-wrap" class="hidden">
        <canvas id="lab-canvas" width="960" height="540"></canvas>
        <div id="lab-status"></div>

        <div class="lab-panel" data-section="tool-record">
          <h3>Record Demo</h3>
          <p>Drive with WASD or arrow keys. Save JSON to <code>sim/rl/demos/</code>.</p>
          <div class="tool-bar">
            <label>Track <select id="track-select"></select></label>
            <button type="button" class="btn" id="btn-start-rec">Start Recording</button>
            <button type="button" class="btn btn-warn" id="btn-stop-rec">Stop</button>
            <button type="button" class="btn" id="btn-save-demo">Save Demo JSON</button>
          </div>
        </div>

        <div class="lab-panel hidden" data-section="tool-review">
          <h3>Review Demos</h3>
          <p>Load a demo file — yellow ghost trail on track.</p>
          <div class="tool-bar">
            <input type="file" id="demo-file" accept=".json,application/json">
          </div>
        </div>

        <div class="lab-panel hidden" data-section="tool-eval">
          <h3>Evaluate Policy</h3>
          <p>Load <code>sim/rl/policy.json</code> or a PyTorch export.</p>
          <div class="tool-bar">
            <input type="file" id="policy-file" accept=".json,application/json">
            <button type="button" class="btn" id="btn-reset-eval">Restart Eval</button>
            <button type="button" class="btn btn-warn" id="btn-stop-eval">Pause</button>
          </div>
        </div>
      </div>

      <div id="lab-doc-wrap">
        <article id="lab-doc-body"></article>
      </div>
    </main>
  </div>

  <script src="online-sim.js"></script>
  <script type="module">
    import { initTrainingLab } from "./training-app.js";
    initTrainingLab();
  </script>
</body>
</html>
